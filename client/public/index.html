<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRDine — Student Self-Order</title>
  <link rel="icon" type="image/jpeg" href="./logo.jpeg">
  <link rel="stylesheet" href="./src/styles/app.css">
  <!-- Load Socket.IO locally from client bundle with CDN fallback -->
  <script src="./socket.io/socket.io.min.js"></script>
  <script>
    if (typeof io === 'undefined') {
      document.write('<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"><\/script>');
    }
  </script>
</head>
<body>
  <div id="app" class="container">
    <header class="app-header">
      <div class="header-inner">
        <div class="header-brand">
          <a href="#" class="brand-logo-btn" aria-label="QRDine Home" title="QRDine Home">
            <span class="brand-logo-circle">
              <img src="./logo.jpeg" alt="QRDine Logo" class="brand-logo-img">
            </span>
          </a>
          <div class="brand-titles">
            <h1>QRDine</h1>
            <p class="subtitle">Campus Canteen Self-Order</p>
          </div>
        </div>
        <div class="status-indicator-wrap">
          <span id="connection-status" class="status-pill status-connecting">Connecting...</span>
        </div>
      </div>
    </header>
    
    <!-- 2-Column Main Content Layout: Menu on Left, Cart on Right -->
    <div id="main-layout" class="main-content-layout">
      <section id="menu-container" class="card"></section>
      <aside class="cart-sticky-panel">
        <section id="cart-container" class="card"></section>
      </aside>
    </div>
    
    <!-- Payment QR Modal -->
    <div id="payment-modal-overlay" class="modal-overlay" style="display: none;">
      <div id="payment-modal" class="modal-content card"></div>
    </div>
    
    <!-- Receipt Card & Order Status Tracking -->
    <section id="receipt-container" style="display: none;"></section>
  </div>

  <!-- Main entry point -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
